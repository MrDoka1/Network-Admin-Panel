[agent]
  interval = "10s"
  flush_interval = "10s"
  round_interval = true

# =========================
# NETFLOW — protocol must match what exporters send:
#   "netflow v5"  — classic Cisco v5 (UDP header version 0x0005)
#   "netflow v9"  — v9 and IPFIX (v10); fails on v5 with "unknown version 5"
# =========================
[[inputs.netflow]]
  service_address = "udp://:2055"

  protocol = "netflow v9"

  # буфер (полезно при нагрузке)
  read_buffer_size = "4MiB"

# =========================
# OUTPUT → VictoriaMetrics
# =========================
[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  database = "netflow"
  timeout = "10s"
  skip_database_creation = true
  content_encoding = "identity"
# Локальный Kafka для разработки (Spring из IntelliJ IDEA на хосте).
#
# PLAINTEXT_HOST → localhost:9092 в метаданных брокера (нет UnknownHostException: kafka).
# PLAINTEXT      → kafka:29092 только внутри Docker-сети compose.
#
# Запуск:
#   docker compose -f docker/docker-compose.kafka-local.yml up -d
# Остановка:
#   docker compose -f docker/docker-compose.kafka-local.yml down
#
# Backend: spring.kafka.bootstrap-servers=localhost:9092 (значение по умолчанию в application.properties).

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: admin-panel-kafka-local
    hostname: kafka
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"

services:
  backend:
    build:
      context: ./admin-panel-backend
      dockerfile: Dockerfile
    container_name: admin-panel-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin_panel
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./admin-panel-frontend
      dockerfile: Dockerfile
    container_name: admin-panel-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  postgres:
    image: postgres:16-alpine
    container_name: admin-panel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_panel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_panel"]
      interval: 5s
      timeout: 5s
      retries: 5

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.0
    container_name: admin-panel-victoriametrics
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data

  telegraf:
    build:
      context: .
      dockerfile: docker/netflow/Dockerfile
    container_name: admin-panel-telegraf-netflow
    depends_on:
      - victoriametrics
    ports:
      - "2055:2055/udp"

volumes:
  postgres_data:
  victoriametrics_data:

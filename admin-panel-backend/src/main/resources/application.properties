spring.application.name=admin-panel-backend

# Префикс инстанса для идентификации источника в Kafka и др. (Docker: APP_INSTANCE_ID)
app.instance-id=${APP_INSTANCE_ID:admin-panel}

# Подключение к БД (можно переопределить переменными окружения)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/admin_panel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Схему обновляет только Liquibase при старте приложения (каждый changeset — один раз, см. таблицу databasechangelog)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Сессии в БД (таблицы SPRING_SESSION* создаёт Liquibase)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# CORS для /api/** — список origin через запятую (переопределить: CORS_ALLOWED_ORIGINS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
# Дополнительно: шаблоны Spring (CORS_ALLOWED_ORIGIN_PATTERNS), напр. http://192.168.*.*:3000 для UI по LAN
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# Локальный брокер: localhost:9092 — слушатель PLAINTEXT_HOST в docker-compose (метаданные не шлют только kafka:…)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.tasks-topic=${KAFKA_TASKS_TOPIC:reconfig.tasks}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=admin-panel-backend
spring.kafka.consumer.enable-auto-commit=false

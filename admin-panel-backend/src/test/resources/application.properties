spring.profiles.active=test

# Тесты без PostgreSQL: встроенная H2, миграции Liquibase отключены (схема сети в тестах не нужна)
spring.datasource.url=jdbc:h2:mem:admin_panel_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=none

spring.session.jdbc.initialize-schema=always

# Kafka (для контекста тестов без брокера — значения-заглушки; интеграционные тесты с Kafka переопределяют)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=admin-panel-backend-test
app.kafka.tasks-topic=reconfig.tasks.test

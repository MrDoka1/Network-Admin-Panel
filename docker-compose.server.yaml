# Запуск на сервере: только pull готовых образов (без сборки из исходников).
# На сервер положите этот файл и каталог docker/netflow/ (нужен telegraf.conf).
# Запуск: docker compose -f docker-compose.server.yaml pull && docker compose -f docker-compose.server.yaml up -d
#
# CORS: рядом можно положить файл .env с одной строкой (как вы открываете UI в браузере — схема, хост, порт):
#   CORS_ALLOWED_ORIGINS=http://192.168.1.10:3000,https://panel.example.com
# Если .env нет, подставятся только localhost (удобно для проверки на самой машине).

services:
  backend:
    image: mrdoka/network-admin-panel-backend:latest
    container_name: admin-panel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin_panel
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"

  frontend:
    image: mrdoka/network-admin-panel-frontend:latest
    container_name: admin-panel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  postgres:
    image: postgres:16-alpine
    container_name: admin-panel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_panel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_panel"]
      interval: 5s
      timeout: 5s
      retries: 5

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.0
    container_name: admin-panel-victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data

  telegraf:
    image: telegraf:latest
    container_name: admin-panel-telegraf-netflow
    restart: unless-stopped
    depends_on:
      - victoriametrics
    ports:
      - "2055:2055/udp"
    volumes:
      - ./docker/netflow/telegraf.conf:/etc/telegraf/telegraf.conf:ro
  
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: admin-panel-kafka
    restart: unless-stopped
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
  
  decision-engine:
  image: tem4ik4545/decision-engine:latest
  container_name: admin-panel-decision-engine
  restart: unless-stopped
  depends_on:
    - kafka
    - postgres
    - victoriametrics
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    KAFKA_TASKS_TOPIC: reconfig.tasks
    KAFKA_RESULTS_TOPIC: results.reconfig
    POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@postgres/admin_panel
    VICTORIAMETRICS_URL: http://victoriametrics:8428

    METRICS_POLL_INTERVAL_SEC: "60"
    VLAN_RESOLUTION_METHOD: auto
    NETFLOW_SRC_ENCODING: int

    ANOMALY_THRESHOLD: "3.0"
    BANDWIDTH_THRESHOLD: "0.85"
    QUARANTINE_VLAN: "999"

    LINK_CAPACITY_MBPS: "1000"
    ICMP_THRESHOLD: "1000.0"
    NEW_SOURCES_THRESHOLD: "10"
    INTER_VLAN_RATIO_THRESHOLD: "0.4"
    MAX_FLOW_BYTES_THRESHOLD: "100000000"

    SEGMENTER_TYPE: greedy
    LOG_LEVEL: INFO

volumes:
  postgres_data:
  victoriametrics_data:
